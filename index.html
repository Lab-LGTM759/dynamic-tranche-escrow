<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tranche Status Monitor</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Ethers.js v6 via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
  <!-- QRCode.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="tranche-card">
  <div class="card-header">
    <h2 class="card-title">Транш #<span id="trancheId">0</span></h2>
  </div>
  
  <div class="info-row">
    <span class="info-label">Объем EUR:</span>
    <span class="info-value" id="eurVolume">-</span>
  </div>
  <div class="info-row">
    <span class="info-label">Курс EUR/USDT:</span>
    <span class="info-value" id="rate">-</span>
  </div>
  <div class="info-row">
    <span class="info-label">Депозит (57.75%):</span>
    <span class="info-value" id="grossUsdt">-</span>
  </div>
  
  <div id="statusBadge" class="status-badge status-ok">Загрузка...</div>

  <div class="pay-details">
    <div class="info-row">
      <span class="info-label">К доплате USDT:</span>
      <span class="info-value text-danger" id="netUsdtToPay">0.00</span>
    </div>
    <div class="info-row">
      <span class="info-label">К доплате ETH:</span>
      <span class="info-value text-danger" id="netEthToPay">0.00</span>
    </div>
  </div>

  <!-- Секция генерации QR для подписей (Tangem) -->
  <div class="qr-section">
    <h3 class="qr-title">Подпись транша (Tangem / Wallet)</h3>
    <div class="role-buttons">
      <button class="btn-role" onclick="generateSignatureQR('investor')">Инвестор</button>
      <button class="btn-role" onclick="generateSignatureQR('oracle')">Оракул</button>
      <button class="btn-role" onclick="generateSignatureQR('receiver')">Приемка</button>
    </div>
  </div>
</div>

<!-- Модальное окно с QR-кодом -->
<div id="qrModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeQRModal()">&times;</span>
    <h3 id="modalTitle">QR Code для Tangem</h3>
    <div id="qrcode"></div>
    <p id="qrMessage" class="qr-msg"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
